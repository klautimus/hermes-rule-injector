[pytest]
# F12 (2026-08-04 audit): root-level pytest.ini so `pytest` from the plugin
# root works. Previously only tests/pytest.ini existed — config discovery walks
# UP from the invocation dir, so running `pytest` at the plugin root used
# prepend import mode, tried to import the plugin's __init__.py as a bare
# module, and failed with 30 collection errors (documented in
# run_adjudicator_tests.py). The root-level test_*.py files next to __init__.py
# cannot be collected by pytest at all (same package-context issue) — they are
# exercised by the standalone runners: run_adjudicator_tests.py and
# run_matcher_integration.py.
testpaths = tests
python_files = test_*.py
addopts = --import-mode=importlib -ra
